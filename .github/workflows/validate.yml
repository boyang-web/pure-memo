name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile scripts/generate_icons.py scripts/check_references.py scripts/build_release.py scripts/build_apk.py

      - name: Check manifest JSON
        run: python -m json.tool manifest.webmanifest > /dev/null

      - name: Check local references
        run: python scripts/check_references.py

      - name: Check Service Worker syntax
        run: node --check sw.js

      # APK 不进 CI 构建（需要 Android SDK），但仓库里的包必须与 app-version 对得上
      - name: Check release artifact
        run: |
          version=$(python -c "import re;s=open('index.html',encoding='utf-8').read();print(re.search(r'name=\"app-version\" content=\"([^\"]+)\"',s).group(1))")
          test -s "release/PureMemo-v$version.apk"
          echo "APK 与版本号一致：PureMemo-v$version.apk"

      - name: Check release packaging
        run: python scripts/build_release.py
