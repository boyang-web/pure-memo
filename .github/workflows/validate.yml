name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile scripts/generate_icons.py scripts/check_references.py scripts/build_release.py scripts/build_apk.py scripts/check_apk.py

      - name: Check manifest JSON
        run: python -m json.tool manifest.webmanifest > /dev/null

      - name: Check local references
        run: python scripts/check_references.py

      - name: Check Service Worker syntax
        run: node --check sw.js

      # APK 不进 CI 构建（需要 Android SDK），但仓库里的包必须与 app-version 对得上，
      # 并且 resources.arsc 未压缩、4 字节对齐（Android 11+ 的硬性要求）
      - name: Check release artifact
        run: python scripts/check_apk.py

      - name: Check release packaging
        run: python scripts/build_release.py
