name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile scripts/generate_icons.py scripts/check_references.py

      - name: Check manifest JSON
        run: python -m json.tool manifest.webmanifest > /dev/null

      - name: Check local references
        run: python scripts/check_references.py

      - name: Check Service Worker syntax
        run: node --check sw.js

      - name: Check release artifact
        run: test -s release/PureMemo-v1.0.apk
