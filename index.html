<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>纯粹备忘录</title>
<meta name="description" content="打开就写，退出即存的极简卡片备忘录">
<meta name="app-version" content="1.1.1">
<meta name="theme-color" content="#0a0d16" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="纯粹备忘录">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg">
<link rel="apple-touch-icon" href="./assets/icons/icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/icon-180.png">

<style>
/* ============ 主题变量 ============ */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --ease-ios: cubic-bezier(.32,.72,0,1);
  --ease-out: cubic-bezier(.22,1,.36,1);
  --radius-card: 22px;
  --radius-sheet: 28px;
  --blur: 26px;
}
html[data-theme="dark"]{
  --bg:#080b13;
  --bg-2:#10162a;
  --glass:rgba(255,255,255,.075);
  --glass-strong:rgba(22,27,42,.78);
  --glass-press:rgba(255,255,255,.13);
  --glass-border:rgba(255,255,255,.13);
  --glass-highlight:rgba(255,255,255,.17);
  --text:#f3f5fb;
  --text-2:rgba(240,243,252,.62);
  --text-3:rgba(240,243,252,.36);
  --accent:#8d9cff;
  --accent-2:#c79dff;
  /* 拖拽期间用的实色背景：关掉 backdrop-filter 后要顶替原来那层玻璃 */
  --glass-solid:rgba(30,36,54,.96);
  --danger:#ff738c;
  --shadow:0 16px 40px rgba(0,0,0,.40);
  --shadow-soft:0 6px 18px rgba(0,0,0,.24);
  --scrim:rgba(4,6,14,.52);
  --blob-a:rgba(112,98,255,.52);
  --blob-b:rgba(0,190,225,.36);
  --blob-c:rgba(255,105,165,.34);
  --field:rgba(255,255,255,.055);
}
html[data-theme="light"]{
  --bg:#e9edf7;
  --bg-2:#f6f4fb;
  --glass:rgba(255,255,255,.58);
  --glass-strong:rgba(255,255,255,.86);
  --glass-press:rgba(255,255,255,.82);
  --glass-border:rgba(255,255,255,.92);
  --glass-highlight:rgba(255,255,255,1);
  --text:#1b2236;
  --text-2:rgba(27,34,54,.60);
  --text-3:rgba(27,34,54,.38);
  --accent:#5a68e8;
  --accent-2:#9b63e8;
  --glass-solid:rgba(255,255,255,.97);
  --danger:#e0455f;
  --shadow:0 16px 40px rgba(48,58,96,.16);
  --shadow-soft:0 6px 18px rgba(48,58,96,.10);
  --scrim:rgba(30,38,66,.28);
  --blob-a:rgba(126,112,255,.40);
  --blob-b:rgba(72,205,235,.34);
  --blob-c:rgba(255,140,185,.36);
  --field:rgba(255,255,255,.48);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overscroll-behavior:none;
  display:flex;align-items:center;justify-content:center;
  transition:background .5s ease,color .5s ease;
}
button,textarea,input{font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.sm{width:17px;height:17px}
.icon.fill{fill:currentColor;stroke:none}

/* ============ 背景光斑（给毛玻璃折射用） ============ */
.ambient{position:fixed;inset:-20%;z-index:0;pointer-events:none;overflow:hidden}
/* 关键：光斑动画只做平移，不做 scale。
   blur 半径是在元素自身坐标系里算的，一旦 scale 变化，模糊图层就得整块重新栅格化——
   三个上百 px 的高斯模糊层每帧重算，就是之前动画掉帧的根源。
   只保留 translate 之后，图层栅格化一次就能一直复用，动画走纯合成，观感和原来一致。 */
.blob{position:absolute;border-radius:50%;filter:blur(56px);opacity:.85;will-change:transform}
.blob.a{width:62vmin;height:62vmin;left:2%;top:2%;background:var(--blob-a);animation:float1 26s ease-in-out infinite alternate}
.blob.b{width:55vmin;height:55vmin;right:0%;top:26%;background:var(--blob-b);animation:float2 31s ease-in-out infinite alternate}
.blob.c{width:58vmin;height:58vmin;left:16%;bottom:-8%;background:var(--blob-c);animation:float3 35s ease-in-out infinite alternate}
@keyframes float1{to{transform:translate3d(18%,14%,0)}}
@keyframes float2{to{transform:translate3d(-20%,-12%,0)}}
@keyframes float3{to{transform:translate3d(14%,-18%,0)}}
/* 拖拽时把背景动画冻住：手在动的时候背景没必要继续呼吸，省下的合成预算全给卡片 */
body.dragging .blob{animation-play-state:paused}
/* 系统要求减少动态效果时直接停掉 */
@media (prefers-reduced-motion:reduce){
  .blob{animation:none}
}

/* ============ 手机壳 ============ */
.phone{
  position:relative;z-index:1;
  width:100%;height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  overflow:hidden;isolation:isolate;
  background:linear-gradient(160deg,rgba(255,255,255,.025),rgba(255,255,255,0) 55%);
}
@media (min-width:600px){
  body{background:radial-gradient(120% 100% at 50% 0%,var(--bg-2),var(--bg) 70%)}
  .phone{
    width:430px;height:min(900px,94vh);
    border-radius:46px;
    border:1px solid var(--glass-border);
    box-shadow:0 40px 100px rgba(0,0,0,.55),inset 0 1px 0 var(--glass-highlight);
  }
  .phone::after{
    content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:104px;height:26px;border-radius:20px;background:rgba(0,0,0,.55);
    z-index:60;pointer-events:none;
  }
}

/* ============ 顶栏 ============ */
.topbar{
  flex:0 0 auto;position:relative;z-index:20;
  padding:calc(env(safe-area-inset-top) + 18px) 18px 14px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(175%);
  backdrop-filter:blur(var(--blur)) saturate(175%);
  border-bottom:1px solid var(--glass-border);
  box-shadow:inset 0 1px 0 var(--glass-highlight);
}
@media (min-width:600px){.topbar{padding-top:34px}}
.brand{min-width:0;display:flex;flex-direction:column;gap:3px}
.brand h1{margin:0;font-size:23px;line-height:1.15;font-weight:700;letter-spacing:-.6px}
.brand .sub{font-size:11.5px;color:var(--text-3);letter-spacing:.2px;white-space:nowrap}
.toolbar{display:flex;align-items:center;gap:2px;flex:none}
.tbtn{
  width:34px;height:34px;border-radius:12px;
  display:grid;place-items:center;color:var(--text-2);
  transition:background .2s,color .2s,transform .2s var(--ease-out);
}
.tbtn:active{transform:scale(.88);background:var(--glass-press)}
.tbtn.active{color:var(--accent)}

/* ============ 面板切换 ============ */
[hidden]{display:none!important}
.segment{
  flex:0 0 auto;position:relative;z-index:18;
  display:flex;gap:4px;margin:10px 14px 2px;padding:4px;border-radius:16px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);
  backdrop-filter:blur(var(--blur)) saturate(160%);
  border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 0 var(--glass-highlight);
}
.seg{
  flex:1;min-width:0;height:32px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:12.5px;font-weight:600;color:var(--text-3);
  transition:background .28s var(--ease-out),color .28s,box-shadow .28s;
}
.seg .icon{width:15px;height:15px}
.seg.on{
  background:var(--glass-press);color:var(--text);
  box-shadow:0 2px 10px rgba(0,0,0,.12),inset 0 1px 0 var(--glass-highlight);
}
.seg .cnt{font-size:10.5px;color:var(--text-3);font-weight:500;white-space:nowrap}
.seg.on .cnt{color:var(--text-2)}
.seg .cnt:empty{display:none}
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative}

/* ============ 看板 ============ */
.board{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:18px 14px calc(env(safe-area-inset-bottom) + 104px + var(--kb,0px));
  scrollbar-width:none;
}
.board::-webkit-scrollbar{display:none}
.board-inner{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;align-items:start}
.phone[data-view="list"] .board-inner{grid-template-columns:1fr}
.group-head{
  grid-column:1/-1;display:flex;align-items:center;gap:9px;
  padding:12px 6px 3px;color:var(--text-2);font-size:12px;font-weight:600;letter-spacing:.4px;
}
.group-head:first-child{padding-top:2px}
.group-head .line{flex:1;height:1px;background:linear-gradient(90deg,var(--glass-border),transparent)}
.group-head .count{font-size:11px;color:var(--text-3);font-weight:500}

/* ---- 卡片 ---- */
.card{
  position:relative;display:flex;flex-direction:column;gap:12px;
  min-height:104px;padding:15px 14px 13px;border-radius:var(--radius-card);
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(165%);
  backdrop-filter:blur(var(--blur)) saturate(165%);
  border:1px solid var(--glass-border);
  box-shadow:var(--shadow-soft),inset 0 1px 0 var(--glass-highlight);
  transition:transform .24s var(--ease-out),opacity .24s,box-shadow .24s,
             background-color .3s var(--ease-out),border-color .3s var(--ease-out);
  /* 填充模式必须是 backwards 而不是 both：cardIn 的 to 帧里写了 transform:none，
     both 会让这条 CSS 动画在播完后永久占住 transform；而 CSS 动画的层叠优先级
     高于脚本创建的动画，于是 FLIP 换序动画会整个被压掉（卡片一动不动）。 */
  animation:cardIn .42s var(--ease-out) backwards;
  cursor:pointer;overflow:hidden;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.card:active:not(.drag-source){transform:scale(.975)}
.card.pinned{
  background:linear-gradient(150deg,rgba(141,156,255,.16),var(--glass) 62%);
  border-color:rgba(160,170,255,.34);
  box-shadow:0 8px 26px rgba(105,115,255,.16),inset 0 1px 0 var(--glass-highlight);
}
html[data-theme="light"] .card.pinned{background:linear-gradient(150deg,rgba(120,132,255,.17),var(--glass) 62%)}
.card.pinned::before{
  content:"";position:absolute;left:0;top:18px;bottom:18px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--accent),var(--accent-2));
}
.card.fresh{animation:cardFresh .9s var(--ease-out) backwards}
@keyframes cardFresh{0%{opacity:0;transform:translateY(-8px) scale(.94);box-shadow:0 0 0 3px var(--accent)}40%{opacity:1;transform:none;box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow-soft)}}
.card-text{
  flex:1;font-size:14.5px;line-height:1.55;letter-spacing:.1px;
  white-space:pre-wrap;word-break:break-word;overflow:hidden;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:9;
  color:var(--text);font-weight:450;
}
.phone[data-view="grid"] .card-text{-webkit-line-clamp:7;font-size:14px}
.phone[data-view="list"] .card-text{-webkit-line-clamp:12}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.card-time{font-size:10.5px;color:var(--text-3);letter-spacing:.1px;white-space:nowrap}
.card-badges{display:flex;align-items:center;gap:5px;color:var(--accent)}
.card-badges .icon{width:13px;height:13px}
.card-menu{
  position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:9px;
  display:grid;place-items:center;color:var(--text-3);
  background:var(--field);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;transition:opacity .2s,color .2s;
}
.card:hover .card-menu,.card:focus-within .card-menu{opacity:1}
@media (hover:none){.card-menu{opacity:.72}}
.card-menu:active{color:var(--accent)}

/* ---- 拖拽排序 ---- */
body.dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}
/* 拖拽期间把玻璃关掉。backdrop-filter 的元素一旦移动或换位，每一帧都要重新采样并模糊背后的整块画面，
   这是手机上最贵的合成操作；换成一层实色后视觉几乎无差，帧率完全是两个量级。
   同时把 transition 里的 transform 摘掉，避免它和 FLIP 动画抢同一个属性导致抖动。 */
body.dragging .board-inner .card{
  -webkit-backdrop-filter:none;backdrop-filter:none;
  background:var(--glass-solid);
  transition:opacity .16s linear,background-color .16s linear,border-color .16s linear;
}
body.dragging .board-inner .card.pinned{
  background:linear-gradient(150deg,rgba(141,156,255,.16),var(--glass-solid) 62%);
}
html[data-theme="light"] body.dragging .board-inner .card.pinned{
  background:linear-gradient(150deg,rgba(120,132,255,.17),var(--glass-solid) 62%);
}
/* 原位留一个"空位"：虚线浅底，等幽灵落下来 */
.card.drag-source{
  opacity:.34;background:var(--field);border-style:dashed;border-color:rgba(160,170,255,.5);
  box-shadow:none;animation:none;
  transition:opacity .16s linear,border-color .16s linear;
}
/* 跟随手指的浮动副本：位移由脚本逐帧插值，这里只定义质感 */
.card.drag-ghost{
  position:fixed;left:0;top:0;z-index:80;margin:0;pointer-events:none;
  animation:none;opacity:.99;will-change:transform;transform-origin:50% 56%;
  -webkit-backdrop-filter:none;backdrop-filter:none;
  background:var(--glass-solid);
  transition:box-shadow .24s var(--ease-out);
  box-shadow:0 14px 30px rgba(0,0,0,.32),0 0 0 1px rgba(160,170,255,.2);
}
.card.drag-ghost.pinned{background:linear-gradient(150deg,rgba(141,156,255,.16),var(--glass-solid) 62%)}
.card.drag-ghost.lifted{box-shadow:0 26px 54px rgba(0,0,0,.46),0 8px 16px rgba(0,0,0,.22),0 0 0 1px rgba(160,170,255,.34)}
html[data-theme="light"] .card.drag-ghost{box-shadow:0 14px 26px rgba(30,40,80,.16),0 0 0 1px rgba(110,120,255,.18)}
html[data-theme="light"] .card.drag-ghost.lifted{box-shadow:0 26px 52px rgba(30,40,80,.26),0 0 0 1px rgba(110,120,255,.3)}
.drag-ghost .card-menu{display:none}
.group-head.drag-temp{opacity:.65}
.group-head.drag-temp .line{background:linear-gradient(90deg,rgba(141,156,255,.55),transparent)}

/* ---- 空状态 ---- */
.empty{
  grid-column:1/-1;margin-top:14vh;text-align:center;padding:0 24px;
  animation:cardIn .5s var(--ease-out) both;
}
.empty .glyph{
  width:76px;height:76px;margin:0 auto 20px;border-radius:26px;
  display:grid;place-items:center;color:var(--text-2);
  background:var(--glass);border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));
  box-shadow:var(--shadow),inset 0 1px 0 var(--glass-highlight);
}
.empty .glyph .icon{width:32px;height:32px}
.empty h2{margin:0 0 8px;font-size:17px;font-weight:650;letter-spacing:-.2px}
.empty p{margin:0;font-size:13px;line-height:1.7;color:var(--text-3)}

/* ============ 长期留存：纯文字版面 ============ */
.archive{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  padding:14px 14px calc(env(safe-area-inset-bottom) + 18px + var(--kb,0px));
}
.archive-head{flex:none;display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:2px 6px 10px}
.archive-title{font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:.3px}
.archive-desc{font-size:10.5px;color:var(--text-3)}
.archive-pages{flex:none;display:flex;gap:6px;padding:0 0 12px}
.page-btn{
  flex:1;min-width:0;height:34px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:12px;font-weight:600;color:var(--text-2);
  background:var(--field);border:1px solid var(--glass-border);
  transition:transform .22s var(--ease-out),background .25s,color .25s,box-shadow .25s;
}
.page-btn:active{transform:scale(.95)}
.page-btn.on{
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  color:#fff;border-color:transparent;
  box-shadow:0 6px 16px rgba(110,110,255,.3),inset 0 1px 0 rgba(255,255,255,.35);
}
.page-btn .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none}
.page-btn.on .dot{background:rgba(255,255,255,.95)}
.archive-paper{
  flex:1 1 auto;min-height:0;display:flex;border-radius:22px;overflow:hidden;
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);
  backdrop-filter:blur(var(--blur)) saturate(160%);
  border:1px solid var(--glass-border);
  box-shadow:var(--shadow-soft),inset 0 1px 0 var(--glass-highlight);
}
#archiveEditor{
  flex:1;width:100%;height:100%;resize:none;border:0;outline:0;
  background:transparent;color:var(--text);
  padding:20px 18px;font-size:15px;line-height:1.85;letter-spacing:.15px;font-weight:450;
  white-space:pre-wrap;word-break:break-word;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
#archiveEditor::placeholder{color:var(--text-3);font-weight:400;line-height:1.8}
.phone[data-panel="archive"] .fab{display:none}
.phone[data-panel="archive"] .tbtn[data-role="board"]{display:none}

/* ============ FAB ============ */
.fab{
  position:absolute;z-index:25;
  right:20px;bottom:calc(env(safe-area-inset-bottom) + 26px);
  width:58px;height:58px;border-radius:20px;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  box-shadow:0 12px 30px rgba(110,110,255,.42),inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .28s var(--ease-out),box-shadow .28s;
}
.fab .icon{width:26px;height:26px;stroke-width:2.2}
.fab:active{transform:scale(.9) rotate(90deg)}
.fab .draft-dot{
  position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;
  background:#ffd66b;border:2px solid rgba(255,255,255,.85);display:none;
}
.fab.has-draft .draft-dot{display:block}

/* ============ 卡片内联编辑：不弹层、不遮罩，直接在置顶上方铺一张整行大卡 ============ */
.card-editing{
  grid-column:1/-1;
  min-height:178px;padding:16px 15px 12px;gap:10px;
  cursor:default;overflow:visible;
  background:linear-gradient(150deg,rgba(141,156,255,.16),var(--glass) 62%);
  border-color:rgba(160,170,255,.34);
  box-shadow:0 0 0 1px rgba(141,156,255,.26),var(--shadow),inset 0 1px 0 var(--glass-highlight);
  animation:none;
  -webkit-user-select:auto;user-select:auto;
}
html[data-theme="light"] .card-editing{background:linear-gradient(150deg,rgba(120,132,255,.17),var(--glass) 62%)}
.card-editing:active{transform:none}
.card-editing textarea{
  flex:0 0 auto;width:100%;min-height:126px;max-height:44vh;
  resize:none;border:0;outline:0;background:transparent;color:var(--text);
  font-size:15.5px;line-height:1.65;letter-spacing:.1px;font-weight:450;
  padding:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  -webkit-user-select:auto;user-select:auto;
}
.card-editing textarea::placeholder{color:var(--text-3);font-weight:400}
.card-editing .card-foot{margin-top:2px}
.card-edit-actions{display:flex;align-items:center;gap:8px}
.ebtn{
  width:38px;height:38px;border-radius:13px;display:grid;place-items:center;
  color:var(--text-2);background:var(--field);
  transition:transform .2s var(--ease-out),opacity .2s;
}
.ebtn:active{transform:scale(.92)}
.ebtn .icon{width:17px;height:17px;stroke-width:2.2}
.ebtn.primary{
  color:#fff;background:linear-gradient(145deg,var(--accent),var(--accent-2));
  box-shadow:0 6px 18px rgba(110,110,255,.32);
}
.ebtn:disabled{opacity:.38;pointer-events:none}

/* ---- 就地浮层菜单：锚定卡片 / 按钮，无遮罩 ---- */
.popover{
  position:absolute;z-index:35;width:220px;padding:6px;
  border-radius:18px;
  background:var(--glass-strong);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:0 20px 48px rgba(0,0,0,.46),inset 0 1px 0 var(--glass-highlight);
  visibility:hidden;opacity:0;pointer-events:none;
  transform:translateY(-6px) scale(.96);
  transition:opacity .18s ease,transform .26s var(--ease-out),visibility .18s;
}
html[data-theme="light"] .popover{box-shadow:0 18px 40px rgba(40,50,90,.22),inset 0 1px 0 var(--glass-highlight)}
.popover.open{visibility:visible;opacity:1;transform:none;pointer-events:auto}
.pop-item{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:10px;border-radius:12px;color:var(--text);
  font-size:13.5px;text-align:left;
  transition:background .16s;
}
.pop-item:active{background:var(--glass-press)}
.pop-item .icon{width:17px;height:17px;color:var(--text-2)}
.pop-item.danger,.pop-item.danger .icon{color:var(--danger)}
.pop-item .meta{
  margin-left:auto;font-size:10.5px;color:var(--text-3);
  white-space:nowrap;max-width:118px;overflow:hidden;text-overflow:ellipsis;
}
.card.menu-open{
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent),var(--shadow-soft),inset 0 1px 0 var(--glass-highlight);
}

/* ---- Toast ---- */
.toast{
  position:absolute;z-index:70;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:14px;white-space:nowrap;
  padding:11px 14px 11px 17px;border-radius:16px;font-size:13px;
  background:var(--glass-strong);
  -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--glass-border);box-shadow:var(--shadow);
  transition:opacity .3s,transform .4s var(--ease-out);
}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--accent);font-weight:650;font-size:13px}

/* ============ 极简：自用时不需要引导 / 说明文字 ============ */
.brand .sub,.empty h2,.empty p,.group-head .count,.seg .cnt{display:none!important}
.topbar{align-items:center}
.seg .icon{width:17px;height:17px}
.empty{margin-top:22vh}
.empty .glyph{opacity:.45}
.group-head{padding-top:14px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="ambient" aria-hidden="true">
  <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
</div>

<div class="phone" id="phone" data-view="grid" data-panel="board">

  <header class="topbar">
    <div class="brand">
      <h1>纯粹备忘录</h1>
      <span class="sub" id="subtitle">打开就写 · 退出即存</span>
    </div>
    <nav class="toolbar" aria-label="工具栏">
      <button class="tbtn" id="btnView" data-role="board" aria-label="切换视图"><svg class="icon" id="viewIcon"><use href="#i-grid"></use></svg></button>
      <button class="tbtn" id="btnTheme" aria-label="切换深浅色"><svg class="icon" id="themeIcon"><use href="#i-moon"></use></svg></button>
      <button class="tbtn" id="btnMore" data-action="menu" aria-label="更多"><svg class="icon fill"><use href="#i-more"></use></svg></button>
    </nav>
  </header>

  <nav class="segment" aria-label="面板切换">
    <button class="seg on" id="segBoard" data-panel="board" aria-pressed="true" aria-label="看板">
      <svg class="icon"><use href="#i-grid"></use></svg><span class="cnt" id="segCount"></span>
    </button>
    <button class="seg" id="segArchive" data-panel="archive" aria-pressed="false" aria-label="长期留存">
      <svg class="icon"><use href="#i-archive"></use></svg><span class="cnt" id="segArchiveCount"></span>
    </button>
  </nav>

  <div class="stage">
    <main class="board" id="board">
      <div class="board-inner" id="boardInner"></div>
    </main>

    <section class="archive" id="archivePane" hidden aria-label="长期留存">
      <div class="archive-pages" id="archivePages" role="tablist" aria-label="留存分页">
        <button class="page-btn on" data-page="0" role="tab" aria-selected="true" aria-label="第 1 页"><span>1</span><i class="dot" style="display:none"></i></button>
        <button class="page-btn" data-page="1" role="tab" aria-selected="false" aria-label="第 2 页"><span>2</span><i class="dot" style="display:none"></i></button>
        <button class="page-btn" data-page="2" role="tab" aria-selected="false" aria-label="第 3 页"><span>3</span><i class="dot" style="display:none"></i></button>
      </div>
      <div class="archive-paper">
        <textarea id="archiveEditor" spellcheck="false" autocapitalize="sentences" aria-label="长期留存文本"></textarea>
      </div>

    <span class="draft-dot"></span>

  <!-- 就地菜单：锚定卡片 / 顶栏按钮，无全屏遮罩 -->
  <div class="popover" id="popover" role="menu" aria-label="操作菜单"></div>
</div>

<script>
(function(){
'use strict';

/* ==================== 存储 ==================== */
var K = {
  cards:'purememo.cards.v1', draft:'purememo.draft.v1', settings:'purememo.settings.v1',
  archive:'purememo.archive.v1',   // 旧版单页留存，仅用于迁移
  pages:'purememo.pages.v1'        // 三页纯文字
};
var PAGE_COUNT = 3;
var memoryFallback = {};
var storageOK = true;
function read(key, fallback){
  try{ var v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
  catch(e){ storageOK = false; return Object.prototype.hasOwnProperty.call(memoryFallback,key) ? memoryFallback[key] : fallback; }
}
function write(key, value){
  memoryFallback[key] = value;
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ storageOK = false; }
}

var state = {
  cards: [],
  pages: ['', '', ''],         // 长期留存：三块独立可编辑纯文本
  page: 0,                     // 当前查看的页（0..2）
  panel: 'board',              // 'board' | 'archive'（冷启动总回到看板）
  draft: { text:'', editingId:null },
  settings: { view:'grid', theme:null, page:0 },
  editing: false,                // 内联编辑大卡是否展开
  noAnim: true,                  // 默认不播入场动画：只有冷启动和真正新增的卡片才需要，否则每次重绘整板都在闪
  wasHidden:false,
  freshId:null,
  popoverOpen:false
};

function load(){
  var c = read(K.cards, []);
  state.cards = Array.isArray(c) ? c.filter(function(x){ return x && typeof x.text === 'string'; }).map(function(x){
    return {
      id: String(x.id || uid()),
      text: x.text,
      createdAt: Number(x.createdAt) || Date.now(),
      updatedAt: Number(x.updatedAt) || Number(x.createdAt) || Date.now(),
      pinned: !!x.pinned,
      pinnedAt: x.pinnedAt ? Number(x.pinnedAt) : null,
      order: (typeof x.order === 'number' && isFinite(x.order)) ? x.order : null
    };
  }) : [];
  var d = read(K.draft, {text:'',editingId:null});
  state.draft = { text: typeof d.text === 'string' ? d.text : '', editingId: d.editingId || null };
  // 三页数据；只有旧版单页存档时自动迁移到第 1 页（旧 key 保留，不丢数据）
  var p = read(K.pages, null);
  if (Array.isArray(p)){
    state.pages = [0,1,2].map(function(i){ return typeof p[i] === 'string' ? p[i] : ''; });
  } else {
    var legacy = read(K.archive, '');
    state.pages = [typeof legacy === 'string' ? legacy : '', '', ''];
    if (state.pages[0]) persistPages();
  }
  var s = read(K.settings, {});
  state.settings = {
    view: s.view === 'list' ? 'list' : 'grid',
    theme: s.theme === 'dark' || s.theme === 'light' ? s.theme : null,
    page: typeof s.page === 'number' && s.page >= 0 && s.page < PAGE_COUNT ? s.page : 0
  };
  state.page = state.settings.page;
  // 旧数据没有手工排序：按时间补一份 order（新的在前），之后拖拽才有基准
  if (state.cards.some(function(c){ return c.order === null; })){
    resetOrderByTime();
    persistCards();
  }
}
function persistCards(){ write(K.cards, state.cards); }
function persistDraft(){ write(K.draft, state.draft); }
function persistSettings(){ write(K.settings, state.settings); }
function persistPages(){ write(K.pages, state.pages); }

function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,9);
}

/* ==================== 工具 ==================== */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function icon(id, cls){
  var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','icon' + (cls ? ' ' + cls : ''));
  var use = document.createElementNS('http://www.w3.org/2000/svg','use');
  use.setAttribute('href','#' + id);
  svg.appendChild(use);
  return svg;
}
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function dayKey(ts){ var d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function timeLabel(ts){
  var d = new Date(ts);
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function groupLabel(ts){
  var d = new Date(ts), now = new Date();
  var today = dayKey(now.getTime());
  var yest = dayKey(now.getTime() - 86400000);
  var k = dayKey(ts);
  if (k === today) return '今天';
  if (k === yest) return '昨天';
  var prefix = d.getFullYear() !== now.getFullYear() ? d.getFullYear() + '年' : '';
  return prefix + (d.getMonth()+1) + '月' + d.getDate() + '日';
}
function fullTime(ts){
  var d = new Date(ts), now = new Date();
  var base = (d.getMonth()+1) + '月' + d.getDate() + '日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  return d.getFullYear() !== now.getFullYear() ? d.getFullYear() + '年' + base : base;
}

/* ==================== 主题 ==================== */
var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  var t = state.settings.theme || (sysDark && sysDark.matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('metaTheme').setAttribute('content', t === 'dark' ? '#080b13' : '#e9edf7');
  document.getElementById('themeIcon').firstElementChild.setAttribute('href', t === 'dark' ? '#i-sun' : '#i-moon');
}
if (sysDark && sysDark.addEventListener) sysDark.addEventListener('change', function(){ if(!state.settings.theme) applyTheme(); });

/* ==================== 渲染看板 ==================== */
var board = document.getElementById('board');
var boardInner = document.getElementById('boardInner');
var phone = document.getElementById('phone');
var archivePane = document.getElementById('archivePane');
var archiveEditor = document.getElementById('archiveEditor');
var segBoard = document.getElementById('segBoard');
var segArchive = document.getElementById('segArchive');

/* ---- 面板切换 / 留存文本同步 ---- */
function syncSubtitle(){
  document.getElementById('subtitle').textContent = state.panel === 'archive'
    ? '长期留存 · 第 ' + (state.page + 1) + ' 页'
    : (state.cards.length
        ? state.cards.length + ' 条备忘 · 按住可拖动排序'
        : '打开就写 · 退出即存');
}
function totalArchiveLength(){
  return state.pages.reduce(function(n, t){ return n + (t ? t.length : 0); }, 0);
}
function pageSummary(i){
  var t = (state.pages[i] || '').trim();
  if (!t) return '空页';
  var first = t.split('\n')[0].replace(/\s+/g,'').slice(0,8);
  return (first ? first + '… · ' : '') + t.length + ' 字';
}
function syncPageButtons(){
  [].forEach.call(document.querySelectorAll('.page-btn'), function(b, i){
    var on = i === state.page;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', String(on));
    var dot = b.querySelector('.dot');
    if (dot) dot.style.display = (state.pages[i] || '').trim() ? '' : 'none';
  });
}
function syncArchiveStatus(){
  var total = totalArchiveLength();
  document.getElementById('segArchiveCount').textContent = total ? total + '字' : '';
  syncPageButtons();
}
function syncArchiveEditor(){
  archiveEditor.value = state.pages[state.page] || '';
  syncArchiveStatus();
}
function setPage(i){
  if (i < 0 || i >= PAGE_COUNT || i === state.page) return;
  state.pages[state.page] = archiveEditor.value;   // 离开前兜底落盘
  state.page = i;
  state.settings.page = i;
  persistPages(); persistSettings();
  archiveEditor.value = state.pages[i] || '';
  archiveEditor.scrollTop = 0;
  syncArchiveStatus();
  syncSubtitle();
}
document.getElementById('archivePages').addEventListener('click', function(e){
  var b = e.target.closest('.page-btn');
  if (b) setPage(Number(b.dataset.page));
});
function setPanel(p, opts){
  closePopover();
  state.panel = p === 'archive' ? 'archive' : 'board';
  var onArchive = state.panel === 'archive';
  phone.setAttribute('data-panel', state.panel);
  board.hidden = onArchive;
  archivePane.hidden = !onArchive;
  segBoard.classList.toggle('on', !onArchive);
  segArchive.classList.toggle('on', onArchive);
  segBoard.setAttribute('aria-pressed', String(!onArchive));
  segArchive.setAttribute('aria-pressed', String(onArchive));
  syncSubtitle();
  if (onArchive){
    stowEditing();            // 切走前先把正在写的内容落卡，再收起编辑大卡
    render();
    archiveEditor.value = state.pages[state.page] || '';
    syncArchiveStatus();
    if (!opts || opts.focus !== false){
      try{ archiveEditor.focus({preventScroll:true}); }catch(e){ archiveEditor.focus(); }
    }
  } else {
    try{ archiveEditor.blur(); }catch(e){}
    render();
  }
}
segBoard.addEventListener('click', function(){ setPanel('board'); });
segArchive.addEventListener('click', function(){ setPanel('archive'); });

/* 组内显示顺序：手工 order 优先，缺省时退回创建时间 */
function sortByOrder(a, b){
  var d = (a.order == null ? 0 : a.order) - (b.order == null ? 0 : b.order);
  if (d) return d;
  return (a.createdAt - b.createdAt) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
}
/** 按时间重排全部卡片并重写 order（旧数据迁移用；新的在前） */
function resetOrderByTime(){
  state.cards.filter(function(c){ return c.pinned; })
    .sort(function(a,b){ return (b.pinnedAt || b.createdAt) - (a.pinnedAt || a.createdAt); })
    .forEach(function(c, i){ c.order = i; });
  var counters = {};
  state.cards.filter(function(c){ return !c.pinned; })
    .sort(function(a,b){ return b.createdAt - a.createdAt; })
    .forEach(function(c){
      var k = dayKey(c.createdAt);
      counters[k] = counters[k] || 0;
      c.order = counters[k]++;
    });
}
/** 新加入某个组的卡片排到最前 */
function edgeOrder(c){
  var k = bucketKeyOf(c), vals = [];
  state.cards.forEach(function(x){
    if (x.id !== c.id && bucketKeyOf(x) === k && typeof x.order === 'number') vals.push(x.order);
  });
  if (!vals.length) return 0;
  return Math.min.apply(null, vals) - 1;
}
function bucketKeyOf(c){ return c.pinned ? 'pinned' : 'd-' + dayKey(c.createdAt); }
function cardById(id){
  for (var i = 0; i < state.cards.length; i++) if (state.cards[i].id === id) return state.cards[i];
  return null;
}

function render(){
  phone.setAttribute('data-view', state.settings.view);
  document.getElementById('viewIcon').firstElementChild.setAttribute('href', state.settings.view === 'grid' ? '#i-list' : '#i-grid');
  syncSubtitle();
  document.getElementById('segCount').textContent = state.cards.length ? String(state.cards.length) : '';
  syncArchiveStatus();
  document.getElementById('fab').classList.toggle('has-draft', !state.editing && !!state.draft.text.trim());

  // 编辑大卡是常驻节点：重新挂载会丢焦点，先记下选区再还原
  var editSel = null;
  if (state.editing && editArea && document.activeElement === editArea){
    editSel = [editArea.selectionStart, editArea.selectionEnd];
  }

  // ---- 归位：按新顺序摆放节点，不整块清空 ----
  // 原来这里是 boardInner.textContent='' 再逐个重建。点卡片编辑、保存、置顶都会走 render，
  // 等于每次都要销毁重建全部卡片，带 backdrop-filter 的节点还要重新栅格化一遍，
  // 在手机上就是那一下明显的停顿。改成复用已有节点、只做移动和增删之后，
  // 大部分卡片连重绘都不会发生。
  var cardPool = {}, headPool = {}, i, node0;
  for (i = 0; i < boardInner.children.length; i++){
    node0 = boardInner.children[i];
    if (node0.classList.contains('card')){
      if (node0.dataset.id) cardPool[node0.dataset.id] = node0;
    } else if (node0.classList.contains('group-head')){
      headPool[node0.dataset.group] = node0;
    }
  }

  var want = [];
  if (state.editing) want.push(ensureEditCard());

  if (!state.cards.length){
    if (!state.editing){
      var empty = el('div','empty');
      var glyph = el('div','glyph'); glyph.appendChild(icon('i-note')); empty.appendChild(glyph);
      want.push(empty);
    }
    applyOrder(want);
    settleEditorDom(editSel);
    return;
  }

  // 正在编辑的卡片由顶部整行大卡接管，列表里暂时隐藏，避免同一内容出现两份
  var editingId = state.editing ? state.draft.editingId : null;
  var visible = state.cards.filter(function(c){ return c.id !== editingId; });

  var groups = [];
  var pinned = visible.filter(function(c){return c.pinned;}).sort(sortByOrder);
  if (pinned.length) groups.push({ k:'pinned', label:'置顶', items:pinned });

  // 日期分组按时间排组的先后，组内按手工 order
  var keys = [];
  visible.forEach(function(c){
    if (!c.pinned){
      var k = dayKey(c.createdAt);
      if (keys.indexOf(k) < 0) keys.push(k);
    }
  });
  keys.sort(function(a,b){ return a < b ? 1 : a > b ? -1 : 0; });   // 新的日期在前
  keys.forEach(function(k){
    var items = visible.filter(function(c){ return !c.pinned && dayKey(c.createdAt) === k; }).sort(sortByOrder);
    groups.push({ k:'d-' + k, label:groupLabel(items[0].createdAt), items:items });
  });

  var delay = 0;
  var noAnim = state.noAnim;
  state.noAnim = false;
  groups.forEach(function(g){
    var head = headPool[g.k];
    if (head){
      delete headPool[g.k];
      var label = head.firstElementChild;
      if (label && label.textContent !== g.label) label.textContent = g.label;
    } else {
      head = el('div','group-head');
      head.dataset.group = g.k;
      head.appendChild(el('span',null,g.label));
      head.appendChild(el('span','line'));
    }
    want.push(head);
    g.items.forEach(function(card){
      var node = cardPool[card.id], isNew = false;
      if (node){ updateCard(node, card); delete cardPool[card.id]; }
      else { node = buildCard(card); isNew = true; }
      if (isNew){
        node.style.animationDelay = (delay * 26) + 'ms';
        delay = Math.min(delay + 1, 10);
        if (card.id === state.freshId) node.classList.add('fresh');
        else if (noAnim) node.style.animation = 'none';
      }
      want.push(node);
    });
  });
  state.freshId = null;
  applyOrder(want);
  settleEditorDom(editSel);
}

/** render 收尾：编辑大卡的内容同步与光标还原（节点复用后仍要手动做） */
function settleEditorDom(editSel){
  if (!state.editing) return;
  syncEditorUI();
  if (editSel){
    try{ editArea.focus({preventScroll:true}); editArea.setSelectionRange(editSel[0], editSel[1]); }catch(e){}
  }
}

/** 把看板子节点按 want 的顺序摆好：已有节点只移动，不在表里的从尾部删掉 */
function applyOrder(want){
  for (var i = 0; i < want.length; i++){
    var cur = boardInner.children[i];
    if (cur !== want[i]) boardInner.insertBefore(want[i], cur || null);
  }
  while (boardInner.children.length > want.length){
    boardInner.removeChild(boardInner.lastElementChild);
  }
}

/** 复用已有卡片节点时只改变化的部分，避免重建 DOM 和重新栅格化 */
function updateCard(node, c){
  var text = node.querySelector('.card-text');
  if (text && text.textContent !== c.text) text.textContent = c.text;
  var time = node.querySelector('.card-time');
  if (time) time.textContent = fullTime(c.updatedAt || c.createdAt);
  node.classList.toggle('pinned', !!c.pinned);
  var badges = node.querySelector('.card-badges');
  if (badges && !!(badges.firstChild) !== !!c.pinned){
    badges.textContent = '';
    if (c.pinned) badges.appendChild(icon('i-pin','sm'));
  }
  node.setAttribute('aria-label', '编辑备忘：' + c.text.slice(0,30));
}

function buildCard(c){
  var node = el('article','card' + (c.pinned ? ' pinned' : ''));
  node.dataset.id = c.id;
  node.setAttribute('tabindex','0');
  node.setAttribute('role','button');
  node.setAttribute('aria-label','编辑备忘：' + c.text.slice(0,30));

  var text = el('div','card-text', c.text);
  node.appendChild(text);

  var foot = el('div','card-foot');
  foot.appendChild(el('span','card-time', fullTime(c.updatedAt || c.createdAt)));
  var badges = el('div','card-badges');
  if (c.pinned) badges.appendChild(icon('i-pin','sm'));
  foot.appendChild(badges);
  node.appendChild(foot);

  var menu = el('button','card-menu');
  menu.dataset.action = 'menu';
  menu.setAttribute('aria-label','更多操作');
  menu.appendChild(icon('i-more','sm fill'));
  node.appendChild(menu);
  return node;
}

/* ==================== Toast ==================== */
var toastEl = document.getElementById('toast');
var toastTimer = null, toastAction = null;
function showToast(msg, actionLabel, fn){
  clearTimeout(toastTimer);
  toastEl.textContent = '';
  toastEl.appendChild(el('span',null,msg));
  toastAction = fn || null;
  if (actionLabel){
    var b = el('button',null,actionLabel);
    b.addEventListener('click', function(){
      var fn = toastAction;   // 先取出回调，hideToast 会把它清空
      hideToast();
      if (fn) fn();
    });
    toastEl.appendChild(b);
  }
  toastEl.classList.add('show');
  toastTimer = setTimeout(hideToast, actionLabel ? 5200 : 2600);
}
function hideToast(){ toastEl.classList.remove('show'); toastAction = null; }

/* ==================== 就地浮层菜单：无遮罩、锚定元素 ==================== */
var popoverEl = document.getElementById('popover');
var popoverAnchor = null;

function fillPopover(items){
  popoverEl.textContent = '';
  items.forEach(function(it){
    var b = el('button','pop-item' + (it.danger ? ' danger' : ''));
    b.appendChild(icon(it.icon));
    b.appendChild(el('span',null,it.label));
    if (it.meta) b.appendChild(el('span','meta',it.meta));
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var fn = it.onSelect;
      if (it.keepOpen){ if (fn) fn(); }          // 二级菜单：原地换内容
      else { closePopover(); if (fn) setTimeout(fn, 120); }
    });
    popoverEl.appendChild(b);
  });
}
function placePopover(anchor, alignRight){
  var pr = phone.getBoundingClientRect();
  var ar = anchor.getBoundingClientRect();
  var pw = popoverEl.offsetWidth, ph = popoverEl.offsetHeight;
  var left = alignRight ? ar.right - pr.left - pw : ar.left - pr.left;
  left = Math.max(8, Math.min(left, pr.width - pw - 8));
  var top = ar.top - pr.top + (alignRight ? ar.height + 8 : 0);
  if (top + ph > pr.height - 8){
    var above = ar.top - pr.top - ph - (alignRight ? 8 : 0);
    top = above >= 8 ? above : Math.max(8, pr.height - ph - 8);
  }
  popoverEl.style.left = left + 'px';
  popoverEl.style.top = top + 'px';
  popoverEl.style.transformOrigin = alignRight ? 'top right' : 'top left';
}
function openPopover(anchor, items, opts){
  opts = opts || {};
  if (!anchor) return;
  var kind = opts.kind || '';
  // 同一锚点、同一菜单再点一次就收起
  if (state.popoverOpen && popoverAnchor === anchor && popoverEl.dataset.kind === kind){
    closePopover();
    return;
  }
  if (popoverAnchor && popoverAnchor !== anchor) popoverAnchor.classList.remove('menu-open');
  fillPopover(items);
  popoverEl.dataset.kind = kind;
  popoverAnchor = anchor;
  placePopover(anchor, !!opts.alignRight);
  anchor.classList.add('menu-open');
  popoverEl.classList.add('open');
  state.popoverOpen = true;
}
function closePopover(){
  if (popoverAnchor) popoverAnchor.classList.remove('menu-open');
  popoverAnchor = null;
  state.popoverOpen = false;
  popoverEl.classList.remove('open');
}
document.addEventListener('pointerdown', function(e){
  if (!state.popoverOpen) return;
  if (popoverEl.contains(e.target)) return;
  if (e.target.closest('[data-action="menu"]')) return;  // 交给按钮自己处理开关
  closePopover();
}, true);
board.addEventListener('scroll', function(){ if (state.popoverOpen) closePopover(); }, {passive:true});

function cardMenu(id, anchor){
  var c = state.cards.find(function(x){return x.id===id;});
  if (!c || !anchor) return;
  openPopover(anchor, [
    { icon:'i-pin', label: c.pinned ? '取消置顶' : '置顶', onSelect:function(){ togglePin(id); } },
    { icon:'i-archive', label:'留存', keepOpen:true, onSelect:function(){ chooseArchivePage(id, anchor); } },
    { icon:'i-copy', label:'复制', onSelect:function(){ copyText(c.text); } },
    { icon:'i-trash', label:'删除', danger:true, onSelect:function(){ deleteCard(id); } }
  ], { kind:'card' });
}

/* ==================== 卡片操作 ==================== */
function addCard(text){
  var now = Date.now();
  var c = { id:uid(), text:text.trim(), createdAt:now, updatedAt:now, pinned:false, pinnedAt:null, order:0 };
  c.order = edgeOrder(c);        // 新卡排在本组最前（或最早排序时排最后）
  state.cards.unshift(c);
  persistCards();
  state.freshId = c.id;
  return c;
}
function togglePin(id){
  var c = state.cards.find(function(x){return x.id===id;});
  if (!c) return;
  c.pinned = !c.pinned;
  c.pinnedAt = c.pinned ? Date.now() : null;
  c.order = edgeOrder(c);
  persistCards(); render();
  showToast(c.pinned ? '已置顶' : '已取消置顶');
}
function deleteCard(id){
  var idx = state.cards.findIndex(function(x){return x.id===id;});
  if (idx < 0) return;
  var removed = state.cards[idx];
  state.cards.splice(idx,1);
  persistCards(); render();
  showToast('已删除', '撤销', function(){
    state.cards.splice(Math.min(idx, state.cards.length), 0, removed);
    persistCards(); state.freshId = removed.id; render();
  });
}
function clearAll(){
  if (!state.cards.length){ showToast('空'); return; }
  var backup = state.cards.slice();
  state.cards = [];
  persistCards(); render();
  showToast('已清空', '撤销', function(){ state.cards = backup; persistCards(); render(); });
}
/* ==================== 长期留存：卡片退化成纯文字，可存到三页 ==================== */
function chooseArchivePage(id, anchor){
  var c = state.cards.find(function(x){return x.id===id;});
  if (!c) return;
  var node = boardInner.querySelector('.card[data-id="' + id + '"]') || anchor;
  var items = [];
  for (var i = 0; i < PAGE_COUNT; i++){
    (function(n){
      items.push({
        icon:'i-archive',
        label:String(n+1),
        meta:pageSummary(n),
        onSelect:function(){ moveToArchive(id, n); }
      });
    })(i);
  }
  openPopover(node, items, { kind:'page' });
}
function moveToArchive(id, pi){
  pi = (typeof pi === 'number' && pi >= 0 && pi < PAGE_COUNT) ? pi : state.page;
  var idx = state.cards.findIndex(function(x){return x.id===id;});
  if (idx < 0) return;
  var card = state.cards[idx];
  var line = card.text.trim();
  if (!line){ deleteCard(id); return; }
  var before = state.pages[pi] || '';
  state.pages[pi] = before.trim() ? before.replace(/\s+$/,'') + '\n\n' + line : line;
  var after = state.pages[pi];
  state.cards.splice(idx,1);
  persistCards(); persistPages(); render(); syncArchiveEditor();
  showToast('已存入第 ' + (pi+1) + ' 页', '撤销', function(){
    // 该页被后续编辑过就不回滚，避免覆盖用户新写的内容
    if (state.pages[pi] === after) state.pages[pi] = before;
    state.cards.splice(Math.min(idx, state.cards.length), 0, card);
    state.freshId = card.id;
    persistCards(); persistPages(); render(); syncArchiveEditor();
  });
}
function clearArchive(){
  var pi = state.page;
  var cur = state.pages[pi] || '';
  if (!cur.trim()){ showToast('空页'); return; }
  state.pages[pi] = '';
  persistPages(); syncArchiveEditor();
  showToast('已清空', '撤销', function(){
    state.pages[pi] = cur; persistPages(); syncArchiveEditor();
  });
}
archiveEditor.addEventListener('input', function(){
  state.pages[state.page] = archiveEditor.value;
  persistPages();
  syncArchiveStatus();
});

function copyText(t){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){showToast('已复制');},function(){legacyCopy(t);});
  } else legacyCopy(t);
}
function legacyCopy(t){
  var ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); showToast('已复制'); }catch(e){ showToast('复制失败，请长按选择文字'); }
  document.body.removeChild(ta);
}

/* ==================== 内联编辑：直接在看板顶部的大卡片里写 ==================== */
var editCardEl = null, editArea = null, editMeta = null, editDone = null;

function ensureEditCard(){
  if (editCardEl) return editCardEl;
  editCardEl = el('article','card card-editing');
  editCardEl.dataset.action = 'editor';

  editArea = document.createElement('textarea');
  editArea.id = 'editArea';
  editArea.rows = 1;
  editArea.setAttribute('enterkeyhint','done');
  editArea.setAttribute('autocapitalize','sentences');
  editArea.setAttribute('autocomplete','off');
  editArea.setAttribute('spellcheck','false');
  editArea.setAttribute('aria-label','编辑备忘');
  editCardEl.appendChild(editArea);

  var foot = el('div','card-foot');
  editMeta = el('span','card-time','');
  foot.appendChild(editMeta);

  var actions = el('div','card-edit-actions');

  var btnCancel = el('button','ebtn');
  btnCancel.type = 'button';
  btnCancel.setAttribute('aria-label','取消');
  btnCancel.appendChild(icon('i-x','sm'));
  btnCancel.addEventListener('click', function(e){ e.stopPropagation(); cancelEditor(); });

  editDone = el('button','ebtn primary');
  editDone.type = 'button';
  editDone.setAttribute('aria-label','存为卡片');
  editDone.appendChild(icon('i-check','sm'));
  editDone.addEventListener('click', function(e){ e.stopPropagation(); saveEditor(); });

  actions.appendChild(btnCancel);
  actions.appendChild(editDone);
  foot.appendChild(actions);
  editCardEl.appendChild(foot);

  editArea.addEventListener('input', function(){
    state.draft.text = editArea.value;
    persistDraft();
    syncEditorUI();
  });
  editArea.addEventListener('keydown', function(e){
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter'){ e.preventDefault(); saveEditor(); }
    else if (e.key === 'Escape'){ e.preventDefault(); cancelEditor(); }
  });
  // 点大卡任意空白处都把焦点交回输入区
  editCardEl.addEventListener('click', function(e){
    if (e.target.closest('button')) return;
    editArea.focus();
  });
  return editCardEl;
}

function growEditor(){
  if (!editArea) return;
  editArea.style.height = 'auto';
  var max = window.innerHeight * 0.44;
  editArea.style.height = Math.max(126, Math.min(editArea.scrollHeight, max)) + 'px';
}

function syncEditorUI(){
  if (!editArea) return;
  if (editArea.value !== state.draft.text) editArea.value = state.draft.text;
  if (editDone) editDone.disabled = !editArea.value.trim();
  var c = state.draft.editingId
    ? state.cards.find(function(x){ return x.id === state.draft.editingId; })
    : null;
  if (editMeta) editMeta.textContent = c ? '编辑 · ' + fullTime(c.createdAt) : '新备忘';
  growEditor();
}

function focusEditor(){
  if (!editArea) return;
  try{ editArea.focus({preventScroll:true}); }catch(e){ editArea.focus(); }
  var n = editArea.value.length;
  try{ editArea.setSelectionRange(n, n); }catch(e){}
}

function openEditor(opts){
  opts = opts || {};
  closePopover();
  // 输入大卡只属于看板，万一从留存面板被唤起，先切回去
  if (state.panel === 'archive') setPanel('board', { focus:false });
  if (opts.mode === 'edit'){
    var c = state.cards.find(function(x){ return x.id === opts.id; });
    if (!c) return;
    state.draft = { text:c.text, editingId:c.id };
  } else {
    // 新建：保留未提交的草稿，但绝不继承"正在编辑某张卡片"的状态
    var keep = opts.keepDraft === true && !state.draft.editingId;
    state.draft = { text: keep ? (state.draft.text || '') : '', editingId: null };
  }
  persistDraft();
  state.editing = true;
  render();
  board.scrollTo({ top:0, behavior:'smooth' });
  // 移动端浏览器要求用户手势才能唤起键盘；被拦截时点大卡即可开始写
  setTimeout(focusEditor, 80);
}

/** 把草稿落成卡片：有 editingId 就更新，否则新建。返回是否有内容写入 */
function commitDraft(){
  var text = (state.draft.text || '').trim();
  var editId = state.draft.editingId;
  if (!text){ state.draft = { text:'', editingId:null }; persistDraft(); return false; }
  if (editId){
    var c = state.cards.find(function(x){ return x.id === editId; });
    if (c){ c.text = text; c.updatedAt = Date.now(); }
    else addCard(text);
  } else {
    addCard(text);
  }
  state.draft = { text:'', editingId:null };
  persistDraft(); persistCards();
  return true;
}

function saveEditor(){
  if (!editArea || !editArea.value.trim()) return;
  state.draft.text = editArea.value;
  commitDraft();
  state.editing = false;
  render();
  board.scrollTo({ top:0, behavior:'smooth' });
  showToast('已存');
}

function cancelEditor(){
  // 编辑已有卡片：放弃本次改动；新建：保留草稿，FAB 上留草稿点
  if (state.draft.editingId){
    state.draft = { text:'', editingId:null };
    persistDraft();
  } else if (editArea){
    state.draft.text = editArea.value;
    persistDraft();
  }
  state.editing = false;
  render();
}

/** 退出 / 切后台：把草稿落成卡片 */
function flushDraftToCard(){ commitDraft(); }

document.getElementById('fab').addEventListener('click', function(){
  stowEditing();          // 先把正在写的内容落卡，再开一张新的输入大卡
  openEditor({ mode:'new', keepDraft:true });
});

/* 键盘高度补偿（部分浏览器 / PWA 布局视口不随键盘收缩） */
function syncKeyboard(){
  var vv = window.visualViewport;
  if (!vv) return;
  var layoutH = document.documentElement.clientHeight;
  var kb = Math.max(0, layoutH - vv.height - vv.offsetTop);
  var kbPx = kb > 60 ? kb : 0;
  document.documentElement.style.setProperty('--kb', kbPx + 'px');
  document.documentElement.style.setProperty('--kb-half', (kbPx / 2) + 'px');
}
if (window.visualViewport){
  visualViewport.addEventListener('resize', syncKeyboard);
  visualViewport.addEventListener('scroll', syncKeyboard);
}

/* ==================== 顶栏 ==================== */
document.getElementById('btnView').addEventListener('click', function(){
  state.settings.view = state.settings.view === 'grid' ? 'list' : 'grid';
  persistSettings(); render();
  showToast(state.settings.view === 'grid' ? '双列' : '单列');
});
document.getElementById('btnTheme').addEventListener('click', function(){

document.getElementById('btnMore').addEventListener('click', function(){

/* ==================== 看板事件 ==================== */
function stowEditing(){
  // 切到别处前，先把当前正在写的内容静默落卡，避免丢字
  if (!state.editing) return;
  if (editArea) state.draft.text = editArea.value;
  commitDraft();
  state.editing = false;
}
boardInner.addEventListener('click', function(e){
  if (dragEndAt && Date.now() - dragEndAt < 420) return;   // 拖动结束后补发的 click 不当作点开编辑
  var node = e.target.closest('.card');
  if (!node || node.classList.contains('card-editing')) return;
  var id = node.dataset.id;
  if (e.target.closest('[data-action="menu"]')){ cardMenu(id, node); return; }
  stowEditing();
  openEditor({ mode:'edit', id:id });
});
boardInner.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var node = e.target.closest('.card');
  if (!node || node.classList.contains('card-editing')) return;
  e.preventDefault();
  stowEditing();
  openEditor({ mode:'edit', id:node.dataset.id });
});

/* ==================== 拖拽排序：按住卡片拖动换序，拖进/拖出「置顶」即置顶/取消置顶 ==================== */
var drag = null, ghostEl = null, dragEndAt = 0, scrollLoop = null, ghostRaf = 0;

boardInner.addEventListener('pointerdown', function(e){
  if (state.editing || drag) return;
  var node = e.target.closest('.card');
  if (!node || node.classList.contains('card-editing')) return;
  if (e.target.closest('[data-action="menu"]')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  var c = cardById(node.dataset.id);
  if (!c) return;
  clearTimeout(drag && drag.timer);
  drag = {
    node:node, id:c.id, group:bucketKeyOf(c), dateKey:'d-' + dayKey(c.createdAt),
    pinned0:!!c.pinned, sx:e.clientX, sy:e.clientY, lastX:e.clientX, lastY:e.clientY,
    pointerType:e.pointerType || 'touch',
    active:false, moved:false, touched:false, zone:null, dir:0,
    slotDirty:false, geom:null, cols:1,
    tx:0, ty:0, gx:0, gy:0, rot:-1.1, scale:1, t0:0, offX:0, offY:0
  };
  drag.timer = setTimeout(beginDrag, 300);   // 按住 300ms 才进入拖拽，短按仍是打开编辑
});
// 拖拽中要吃掉触摸滚动，否则页面会跟着手指滚
boardInner.addEventListener('touchmove', function(e){
  if (drag && drag.active) e.preventDefault();
}, { passive:false });

function beginDrag(){
  if (!drag || drag.active) return;
  var node = drag.node;
  if (!node.isConnected){ drag = null; return; }   // 期间重绘过，节点已不在看板上
  var r = node.getBoundingClientRect();
  drag.active = true;
  drag.t0 = performance.now();
  drag.offX = drag.sx - r.left;
  drag.offY = drag.sy - r.top;
  drag.gx = drag.tx = r.left;
  drag.gy = drag.ty = r.top;
  drag.cols = gridCols();          // 单列/双列的落点判定规则不同，起手时记一次

  ghostEl = node.cloneNode(true);
  ghostEl.classList.add('drag-ghost');
  ghostEl.style.width = r.width + 'px';
  ghostEl.style.height = r.height + 'px';
  ghostEl.style.transform = 'translate3d(' + r.left + 'px,' + r.top + 'px,0) scale(1)';
  ghostEl._x = r.left; ghostEl._y = r.top; ghostEl._rot = drag.rot; ghostEl._scale = 1;
  document.body.appendChild(ghostEl);
  // 抬起：阴影加深 + 轻微放大，先加类再等一帧，让 box-shadow 有过渡起点
  requestAnimationFrame(function(){ if (ghostEl) ghostEl.classList.add('lifted'); });

  node.classList.add('drag-source');
  document.body.classList.add('dragging');
  var before = boardRects();
  ensureDragZones();
  var after = boardRects();
  animateShift(before, after);   // 临时分组头插入时的位移也走同一套缓动
  drag.geom = geomFrom(after);   // 整场拖拽只在这里和每次换序后测量布局
  startGhostLoop();
  closePopover();
  if (navigator.vibrate){ try{ navigator.vibrate(10); }catch(err){} }
}

/* ---- 幽灵跟随：逐帧趋近手指，慢半拍的滞后感 + 依速度倾斜 ---- */
function startGhostLoop(){
  if (ghostRaf) return;
  var step = function(){
    if (!drag || !drag.active || !ghostEl){ ghostRaf = 0; return; }
    // 落点判定合并进这个 rAF：指针事件到多快都只算一次，且只做几何表上的数学比较
    if (drag.slotDirty){
      drag.slotDirty = false;
      updateSlot(drag.lastX, drag.lastY);
    }
    var lag = 0.34;
    drag.gx += (drag.tx - drag.gx) * lag;
    drag.gy += (drag.ty - drag.gy) * lag;
    if (Math.abs(drag.tx - drag.gx) < 0.15) drag.gx = drag.tx;
    if (Math.abs(drag.ty - drag.gy) < 0.15) drag.gy = drag.ty;
    var wantRot = Math.max(-4.5, Math.min(4.5, (drag.tx - drag.gx) * 0.09)) - 1.1;
    drag.rot += (wantRot - drag.rot) * 0.18;
    var t = Math.min(1, (performance.now() - drag.t0) / 200);
    drag.scale = 1 + 0.038 * (1 - Math.pow(1 - t, 3));
    ghostEl._x = drag.gx; ghostEl._y = drag.gy;
    ghostEl._rot = drag.rot; ghostEl._scale = drag.scale;
    ghostEl.style.transform =
      'translate3d(' + drag.gx.toFixed(2) + 'px,' + drag.gy.toFixed(2) + 'px,0)'
      + ' rotate(' + drag.rot.toFixed(2) + 'deg) scale(' + drag.scale.toFixed(4) + ')';
    ghostRaf = requestAnimationFrame(step);
  };
  ghostRaf = requestAnimationFrame(step);
}
function stopGhostLoop(){ if (ghostRaf){ cancelAnimationFrame(ghostRaf); ghostRaf = 0; } }

/* ---- 位移动画：FLIP + 贝塞尔回弹 ----
   以前给每张移位卡片生成 23 帧关键帧，一次换序能堆出几千个关键帧对象；
   现在只给两个端点，加减速和末端回弹全部交给 cubic-bezier，GPU 侧只跑一条曲线。
   同一次换序里所有卡片共用一个时长（按最大位移算），它们一起出发、一起停住，
   这才是"挤占"该有的整体感；每张各用各的时长会显得零碎。 */
var SHIFT_EASE = 'cubic-bezier(.32,.72,.24,1)';
/** 看板当前是几列（单列/双列）。落点判定里横向坐标只在多列时才有意义。 */
function gridCols(){
  var v = getComputedStyle(boardInner).gridTemplateColumns;
  if (!v || v === 'none') return 1;
  return v.trim().split(/\s+/).length;
}
function boardRects(){
  var map = {}, kids = boardInner.children;
  for (var i = 0; i < kids.length; i++){
    var n = kids[i], key = null;
    if (n.classList.contains('card')){
      if (n.classList.contains('card-editing')) continue;
      key = 'c:' + n.dataset.id;
    } else if (n.classList.contains('group-head')){
      key = 'h:' + n.dataset.group;
    } else continue;
    var r = n.getBoundingClientRect();
    map[key] = { l:r.left, t:r.top, w:r.width, h:r.height, node:n };
  }
  return map;
}
/** 把一次测量结果转成「看板内容坐标」的几何表，供拖拽期间做纯数学比较 */
function geomFrom(rects){
  var st = board.scrollTop, cards = {}, heads = [], k;
  for (k in rects){
    var r = rects[k];
    if (k.slice(0,2) === 'c:') cards[k.slice(2)] = { l:r.l, t:r.t + st, w:r.w, h:r.h };
    else if (r.node) heads.push({ key:k.slice(2), t:r.t + st, node:r.node });
  }
  heads.sort(function(a,b){ return a.t - b.t; });
  return { cards:cards, heads:heads, scroll:st };
}
/** 正在跑动画的元素停回布局位置（同一帧内，用户看不到中间态） */
function freezeShifts(){
  var kids = boardInner.children;
  for (var i = 0; i < kids.length; i++){
    var n = kids[i];
    if (n._shift){ try{ n._shift.cancel(); }catch(e){} n._shift = null; }
  }
}
function animateShift(before, after){
  var kids = boardInner.children, jobs = [], maxDist = 0;
  for (var i = 0; i < kids.length; i++){
    var n = kids[i], key = null;
    if (n.classList.contains('card')){
      if (n.classList.contains('card-editing')) continue;
      key = 'c:' + n.dataset.id;
    } else if (n.classList.contains('group-head')){
      key = 'h:' + n.dataset.group;
    } else continue;
    var a = after[key], b = before[key];
    if (!a || !b || !n.animate) continue;
    var dx = b.l - a.l, dy = b.t - a.t;
    if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) continue;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > maxDist) maxDist = dist;
    jobs.push({ n:n, dx:dx, dy:dy });
  }
  if (!jobs.length) return 0;
  // 位移越远走得越久，上限压住跨屏时的拖沓感；下限保证小挪动也有可感知的过渡
  var dur = Math.max(200, Math.min(340, 190 + maxDist * 0.45));
  for (var j = 0; j < jobs.length; j++){
    var job = jobs[j];
    try{
      job.n._shift = job.n.animate([
        { transform: 'translate3d(' + job.dx.toFixed(2) + 'px,' + job.dy.toFixed(2) + 'px,0)' },
        { transform: 'translate3d(0,0,0)' }
      ], { duration: dur, easing: SHIFT_EASE });
    }catch(e){}
  }
  return dur;
}
/** 就地换序：先量视觉位置 → 停掉在飞的动画 → 插入 → 把视觉差补成动画。
    顺序很关键：getBoundingClientRect 含 transform，所以「停动画之前」量到的是
    卡片此刻真正在屏幕上的位置；拿它和插入后的布局位置相减，被打断的动画就能
    从当前所在的地方接着走，而不是先跳回格子再重新出发。 */
function reorder(node, ref){
  var before = boardRects();      // 含动画中间帧的视觉位置
  freezeShifts();                 // 取消动画回到布局位置
  boardInner.insertBefore(node, ref);
  var after = boardRects();       // 纯布局位置
  animateShift(before, after);
  if (drag) drag.geom = geomFrom(after);   // 复用这次测量，拖拽期间不再逐帧量布局
}

/** 拖拽期间补齐落点分组：没有置顶组就临时造一个，卡片自己的日期组没了也补一个 */
function ensureDragZones(){
  if (!boardInner.querySelector('.group-head[data-group="pinned"]')) insertTempHead('pinned','置顶');
  if (!boardInner.querySelector('.group-head[data-group="' + drag.dateKey + '"]')){
    var c = cardById(drag.id);
    insertTempHead(drag.dateKey, groupLabel(c ? c.createdAt : Date.now()));
  }
}
function insertTempHead(key, label){
  var h = el('div','group-head drag-temp');
  h.dataset.group = key;
  h.appendChild(el('span',null,label));
  h.appendChild(el('span','line'));
  if (key === 'pinned'){ boardInner.insertBefore(h, boardInner.firstChild); return h; }
  var mine = key.slice(2);
  var heads = boardInner.querySelectorAll('.group-head');
  for (var i = 0; i < heads.length; i++){
    var k = heads[i].dataset.group || '';
    if (k === 'pinned') continue;
    var other = k.slice(2);
    // 日期新的在前：比 mine 新的组排在前面，遇到第一个更早的组就插在它前面
    if (other < mine){ boardInner.insertBefore(h, heads[i]); return h; }
  }
  boardInner.appendChild(h);
  return h;
}
function removeTempHeads(){
  var t = boardInner.querySelectorAll('.group-head.drag-temp');
  for (var i = 0; i < t.length; i++) t[i].parentNode.removeChild(t[i]);
}
/** 拖拽落位后收尾分组头：名下还有卡片的转成正式分组头，空掉的删掉。
    这样就不必整板重建 DOM —— 卡片节点原地不动，只增删分组标题。
    注意要覆盖上一轮已经"转正"的置顶组：把卡片拖出去后它也会变空。 */
function settleTempHeads(){
  var heads = Array.prototype.slice.call(boardInner.querySelectorAll('.group-head'));
  heads.forEach(function(h){
    var n = h.nextElementSibling, has = false;
    while (n && !n.classList.contains('group-head')){
      if (n.classList.contains('card')){ has = true; break; }
      n = n.nextElementSibling;
    }
    if (!has){ if (h.parentNode) h.parentNode.removeChild(h); }
    else h.classList.remove('drag-temp');
  });
}

function boardZones(){
  var list = [], cur = null;
  Array.prototype.forEach.call(boardInner.children, function(n){
    if (n.classList.contains('group-head')){
      cur = { key:n.dataset.group, head:n, cards:[] };
      list.push(cur);
    } else if (cur && n.classList.contains('card') && !n.classList.contains('card-editing')){
      cur.cards.push(n);
    }
  });
  return list;
}
/** 按指针位置把卡片就地挪到合适的插入点；只允许落在「置顶」和卡片自己的日期组。
    全程只用 beginDrag/reorder 时缓存下来的几何表做数学比较，不再逐帧 getBoundingClientRect。 */
function updateSlot(x, y){
  if (!drag || !drag.active) return;
  var g = drag.geom;
  if (!g) return;
  var cy = y + (board.scrollTop - g.scroll);      // 指针换算到看板内容坐标，滚动时不用重新测量

  var zone = null;
  for (var i = 0; i < g.heads.length; i++){
    if (cy >= g.heads[i].t - 8) zone = g.heads[i];
  }
  if (!zone) return;
  if (zone.key !== 'pinned' && zone.key !== drag.dateKey) return;

  var node = drag.node, z = null, zones = boardZones();
  for (var j = 0; j < zones.length; j++){ if (zones[j].key === zone.key) z = zones[j]; }
  if (!z) return;

  var cards = z.cards.filter(function(n){ return n !== node; });
  var ref, oneCol = drag.cols === 1;
  if (!cards.length){
    ref = z.head.nextSibling;
  } else {
    var at = 0;
    for (var k = 0; k < cards.length; k++){
      var gr = g.cards[cards[k].dataset.id];
      if (!gr) continue;
      var mid = gr.t + gr.h / 2;
      // 双列时同一行有两张卡，横向在哪一半决定插到它前面还是后面；
      // 单列每行只有一张卡，横向位置没有意义 —— 只按纵向中线判断，
      // 否则手指停在左半边就永远"插到前面"（卡片卡住不动），停在右半边又会整格跳过头。
      var sameRow = !oneCol && Math.abs(cy - mid) < gr.h / 2 - 2;
      var before = sameRow ? (x < gr.l + gr.w / 2) : (cy < mid);
      if (before) break;
      at++;
    }
    ref = at < cards.length ? cards[at] : cards[cards.length - 1].nextSibling;
  }
  drag.zone = zone.key;
  node.classList.toggle('pinned', zone.key === 'pinned');   // 预览落点是否置顶
  if (ref === node) return;          // 已经在这个位置
  // ref 为 null 表示落在这个组的末尾（该组最后一张卡后面没有兄弟节点），append 即可
  reorder(node, ref || null);
  drag.touched = true;
}

function moveGhost(x, y){
  if (!drag) return;
  drag.tx = x - drag.offX;
  drag.ty = y - drag.offY;
}

function edgeScroll(y){
  if (!drag) return;
  var r = board.getBoundingClientRect(), f = 58;
  drag.dir = y < r.top + f ? -1 : (y > r.bottom - f ? 1 : 0);
  if (!drag.dir || scrollLoop) return;
  var step = function(){
    if (!drag || !drag.active || !drag.dir){ scrollLoop = null; return; }
    var before = board.scrollTop;
    board.scrollTop += drag.dir * 8;
    if (board.scrollTop === before){ scrollLoop = null; return; }
    updateSlot(drag.lastX, drag.lastY);
    scrollLoop = requestAnimationFrame(step);
  };
  scrollLoop = requestAnimationFrame(step);
}
function stopScrollLoop(){
  if (scrollLoop){ cancelAnimationFrame(scrollLoop); scrollLoop = null; }
  if (drag) drag.dir = 0;
}

document.addEventListener('pointermove', function(e){
  if (!drag) return;
  if (!drag.active){
    var ax = Math.abs(e.clientX - drag.sx), ay = Math.abs(e.clientY - drag.sy);
    if (drag.pointerType === 'mouse' && ax + ay > 6){
      clearTimeout(drag.timer);
      beginDrag();                 // 鼠标不需要长按：按住一拖就起，短按仍然是编辑
    } else {
      if (ax > 8 || ay > 8) cancelDrag();  // 触摸：这是在滚动，不是拖拽
      return;
    }
    if (!drag || !drag.active) return;
  }
  if (Math.abs(e.clientX - drag.sx) > 4 || Math.abs(e.clientY - drag.sy) > 4) drag.moved = true;
  e.preventDefault();
  drag.lastX = e.clientX; drag.lastY = e.clientY;
  moveGhost(e.clientX, e.clientY);
  drag.slotDirty = true;              // 落点判定留给下一帧统一算，避免一次手势触发多次布局
  edgeScroll(e.clientY);
}, { passive:false });

document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', cancelDrag);
window.addEventListener('blur', cancelDrag);   // 指针在窗口外松开时兜底，别把拖拽卡住

/** 幽灵落进格子：收拢 + 淡出，同时占位卡淡入，动画结束再重绘接上最终状态 */
function settleGhost(g, node, done){
  var finished = false;
  function finish(){
    if (finished) return;
    finished = true;
    if (g && g.parentNode) g.parentNode.removeChild(g);
    if (done) done();
  }
  if (!g || !g.parentNode){ finish(); return; }
  // 占位卡可能还带着上一段位移动画，先停回布局位置再量落点
  if (node._shift){ try{ node._shift.cancel(); }catch(e){} node._shift = null; }
  var r = node.getBoundingClientRect();
  var from = 'translate3d(' + (g._x || 0) + 'px,' + (g._y || 0) + 'px,0)'
           + ' rotate(' + (g._rot || 0) + 'deg) scale(' + (g._scale || 1) + ')';
  var to = 'translate3d(' + r.left + 'px,' + r.top + 'px,0) rotate(0deg) scale(1)';
  // 落位时长只跟"还差多远"有关：手指基本就在格子上时立刻收住，不要拖着让人等
  var dd = Math.sqrt(Math.pow(r.left - (g._x || 0), 2) + Math.pow(r.top - (g._y || 0), 2));
  var durS = Math.max(110, Math.min(200, 90 + dd * 0.24));
  try{
    var a = g.animate([{ transform:from, opacity:1 }, { transform:to, opacity:0 }],
      { duration:durS, easing:'cubic-bezier(.2,.86,.28,1)', fill:'forwards' });
    a.onfinish = finish;
    a.oncancel = finish;
  }catch(e){}
  try{ node.animate([{ opacity:.34 }, { opacity:1 }], { duration:Math.min(durS, 130), easing:'ease-out' }); }catch(e){}
  setTimeout(finish, durS + 120);   // 兜底
}
/** 幽灵原地淡出（没有落点可去的情况） */
function fadeGhost(g){
  if (!g) return;
  var drop = function(){ if (g.parentNode) g.parentNode.removeChild(g); };
  try{
    var a = g.animate([{ opacity:1 }, { opacity:0 }], { duration:140, easing:'ease-out', fill:'forwards' });
    a.onfinish = drop;
  }catch(e){}
  setTimeout(drop, 240);
}

function endDrag(){
  if (!drag) return;
  clearTimeout(drag.timer);
  if (!drag.active){ drag = null; return; }
  var node = drag.node, moved = drag.moved, touched = drag.touched;
  var wasPinned = drag.pinned0, pinNow = drag.zone === 'pinned';
  var g = ghostEl;
  ghostEl = null;
  stopGhostLoop();
  stopScrollLoop();
  document.body.classList.remove('dragging');

  // 按住但没拖动（也没换过位置）：幽灵原地淡出，随后的 click 照常打开编辑
  if (!moved && !touched){
    node.classList.remove('drag-source');
    drag = null;
    removeTempHeads();
    fadeGhost(g);
    return;
  }

  commitDrop();          // 先按 DOM 现状落序（临时分组头也参与），再收尾临时头
  settleTempHeads();
  drag = null;
  persistCards();
  dragEndAt = Date.now();
  if (pinNow !== wasPinned) showToast(pinNow ? '已置顶' : '已取消置顶');
  node.classList.remove('drag-source');
  // 这里的 DOM 已经就是最终顺序和最终分组了，没必要整板重建——
  // 重排几十张带毛玻璃的卡片，正好卡在松手这一下，是最容易被感知到的掉帧。
  settleGhost(g, node, null);
}

function cancelDrag(){
  if (!drag) return;
  clearTimeout(drag.timer);
  if (!drag.active){ drag = null; return; }
  var node = drag.node, g = ghostEl;
  ghostEl = null;
  stopGhostLoop();
  stopScrollLoop();
  document.body.classList.remove('dragging');
  removeTempHeads();
  drag = null;
  dragEndAt = Date.now();
  node.classList.remove('drag-source');
  state.noAnim = true;
  fadeGhost(g);
  render();              // 顺序没提交，重绘回到原位
}

/** 按看板当下的 DOM 顺序重写 order，并同步 pinned（拖进/拖出置顶） */
function commitDrop(){
  var seq = {}, cur = null;
  Array.prototype.forEach.call(boardInner.children, function(n){
    if (n.classList.contains('group-head')){
      cur = n.dataset.group;
      if (!seq[cur]) seq[cur] = [];
      return;
    }
    if (cur && n.classList.contains('card') && !n.classList.contains('card-editing')){
      seq[cur].push(n.dataset.id);
    }
  });
  Object.keys(seq).forEach(function(k){
    var pinned = (k === 'pinned');
    seq[k].forEach(function(id, i){
      var c = cardById(id);
      if (!c) return;
      c.order = i;
      if (c.pinned !== pinned){
        c.pinned = pinned;
        c.pinnedAt = pinned ? (c.pinnedAt || Date.now()) : null;
      }
    });
  });
}

/* ==================== 生命周期：退出即存 / 回来即写 ==================== */
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden'){
    closePopover();
    // 留存文本是输入即存的，这里再兜一次底（输入法组合态可能还没触发 input）
    if (state.panel === 'archive' && document.activeElement === archiveEditor){
      state.pages[state.page] = archiveEditor.value;
      persistPages();
    }
    // input 事件已实时同步到 draft，这里再读一次 DOM 兜住输入法组合态，
    // 这样 visibilitychange / pagehide / beforeunload 多次触发也只会落一张卡。
    if (state.editing && editArea) state.draft.text = editArea.value;
    flushDraftToCard();
    state.editing = false;
    // 切后台时同步刷新看板，保证系统后台快照也是最新内容
    render();
    state.wasHidden = true;
  } else if (document.visibilityState === 'visible'){
    if (state.wasHidden){
      state.wasHidden = false;
      // 在长期留存面板编辑时不展开输入大卡，避免打断
      if (!state.popoverOpen && state.panel === 'board') setTimeout(function(){ openEditor({ mode:'new' }); }, 220);
    }
  }
});
window.addEventListener('pagehide', flushDraftToCard);
window.addEventListener('beforeunload', flushDraftToCard);
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (state.popoverOpen) closePopover();
  else if (state.editing) cancelEditor();
});

/* ==================== 启动 ==================== */
load();
applyTheme();
setPanel('board', { focus:false });   // 冷启动始终回到看板，接着展开输入大卡
archiveEditor.value = state.pages[state.page] || '';
state.noAnim = false;                 // 仅冷启动这一次播卡片依次浮现的入场动画
render();
syncKeyboard();
if (!storageOK) setTimeout(function(){ showToast('本地存储不可用'); }, 1200);
setTimeout(function(){ openEditor({ mode:'new', keepDraft:true }); }, 420);

/* Service Worker：离线可用 */
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
})();
</script>
</body>
